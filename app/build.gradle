plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nilawarlabs.nilxdrive'
    compileSdk 35
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.nilawarlabs.nilxdrive'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.1'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.0'
}
